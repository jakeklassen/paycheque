# Weekly check of src/lib/rates.json against CRA's T4127 payroll formulas.
# - January-edition changes: opens (or updates) a pull request with the new values
# - Anything a person has to resolve (July prorated values, Quebec, page changes):
#   opens (or updates) an issue, and closes it once nothing is left
# - CRA unreachable, or the check itself fails: the run fails
# Needs "Allow GitHub Actions to create and approve pull requests" under
# Settings → Actions → General.
name: Rate check

on:
  schedule:
    - cron: '17 13 * * 1' # Mondays, 9:17 a.m. Eastern (EDT)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: rates

env:
  ISSUE_TITLE: Rates need a manual check
  REPORT: ${{ github.workspace }}/../rates-report.md

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile

      - id: rates
        name: Check (and update) rates
        run: |
          set +e
          rm -f "$REPORT"
          pnpm check:rates --write --report "$REPORT"
          status=$?
          # Every result writes the report; without one (rates.json unreadable,
          # say) the check didn't finish, whatever its exit code
          [ -s "$REPORT" ] || status=3
          echo "status=$status" >> "$GITHUB_OUTPUT"

      # 0 and 1 are results; anything else (2 unreachable, 3 failed, a crash) is not
      - name: Fail when the check didn't finish
        if: steps.rates.outputs.status != '0' && steps.rates.outputs.status != '1'
        env:
          STATUS: ${{ steps.rates.outputs.status }}
        run: |
          if [ "$STATUS" = 2 ]; then
            echo "::error::CRA couldn't be reached"
          else
            echo "::error::The rate check failed (exit $STATUS)"
          fi
          exit 1

      - id: diff
        name: Did rates.json change?
        run: |
          if git diff --quiet -- src/lib/rates.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pull requests opened with GITHUB_TOKEN don't trigger CI, so check here
      - name: Run checks on the updated rates
        if: steps.diff.outputs.changed == 'true'
        run: |
          {
            echo
            echo '### Checks on the updated rates'
            echo
            for cmd in 'pnpm lint' 'pnpm check' 'pnpm test:unit --run --project server'; do
              if $cmd > /dev/null 2>&1; then
                echo "- ✅ \`$cmd\`"
              else
                echo "- ❌ \`$cmd\` failed ([workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}))"
              fi
            done
          } >> "$REPORT"

      - id: pr
        name: Open or update the pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: rates/t4127-update
          add-paths: src/lib/rates.json
          commit-message: 'chore: update rates from CRA T4127'
          title: Update rates from CRA T4127
          body-path: ${{ env.REPORT }}
          delete-branch: true

      # Runs whether or not a pull request was opened: status 1 means something
      # still needs a person after the update
      - name: Open, update or close the manual-check issue
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.rates.outputs.status }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          number=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" \
            --json number,title --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[0].number // empty")
          if [ -n "$PR_URL" ]; then
            printf '\nThe values the check could update are in %s.\n' "$PR_URL" >> "$REPORT"
          fi
          if [ "$STATUS" = 1 ]; then
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file "$REPORT"
            else
              gh issue create --title "$ISSUE_TITLE" --body-file "$REPORT"
            fi
          elif [ "$STATUS" = 0 ] && [ -n "$number" ]; then
            gh issue close "$number" --comment 'Nothing needs a manual check any more.'
          fi
